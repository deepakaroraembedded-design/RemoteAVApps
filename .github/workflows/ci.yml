name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test (GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdrm-dev \
            libasound2-dev \
            libswresample-dev \
            libswscale-dev \
            libx264-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        shell: bash -e -o pipefail {0}
        run: cmake --build build -j$(nproc) 2>&1 | tee build/build.log

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-gcc
          path: |
            build/build.log
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  sanitizer:
    name: Sanitizer build (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdrm-dev \
            libasound2-dev \
            libswresample-dev \
            libswscale-dev \
            libx264-dev

      - name: Configure with sanitizers
        run: cmake -S . -B build-asan -DVMC_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        shell: bash -e -o pipefail {0}
        run: cmake --build build-asan -j$(nproc) 2>&1 | tee build-asan/build.log

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-sanitizer
          path: |
            build-asan/build.log
            build-asan/Testing/Temporary/LastTest.log
            build-asan/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  clang:
    name: Build and test (Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            build-essential \
            cmake \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdrm-dev \
            libasound2-dev \
            libswresample-dev \
            libswscale-dev \
            libx264-dev

      - name: Configure
        run: cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        shell: bash -e -o pipefail {0}
        run: cmake --build build-clang -j$(nproc) 2>&1 | tee build-clang/build.log

      - name: Test
        run: ctest --test-dir build-clang --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-clang
          path: |
            build-clang/build.log
            build-clang/Testing/Temporary/LastTest.log
            build-clang/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  debug-instrumentation:
    name: Debug instrumentation build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libdrm-dev \
            libasound2-dev \
            libswresample-dev \
            libswscale-dev \
            libx264-dev

      - name: Configure with VMC_DEBUG
        run: cmake -S . -B build-debug -DVMC_DEBUG=1 -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        shell: bash -e -o pipefail {0}
        run: cmake --build build-debug -j$(nproc) 2>&1 | tee build-debug/build.log

      - name: Test
        run: ctest --test-dir build-debug --output-on-failure

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-debug
          path: |
            build-debug/build.log
            build-debug/Testing/Temporary/LastTest.log
            build-debug/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  harness-selftest:
    name: Offline harness self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Run selftest_synth.py
        run: python3 tools/av_harness/selftest_synth.py
